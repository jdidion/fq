[package]
name = "fq-tile-subsample"
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
flate2 = { version = "1.0.35", default-features = false, features = ["zlib-rs"] }
fq = { path = ".." }
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.10"
tracing = "0.1"
tracing-subscriber = "0.3"
